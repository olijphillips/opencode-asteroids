name: Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: AI Triage
        uses: actions/github-script@v7
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title;
            const body = issue.body || '';

            const AVAILABLE_LABELS = [
              'bug', 'enhancement', 'documentation', 'question',
              'good first issue', 'performance', 'ui/ux', 'gameplay'
            ];

            const systemPrompt = [
              'You are a GitHub issue triage assistant for an Asteroids arcade game (HTML5 Canvas, vanilla JS).',
              '',
              'Available labels: ' + AVAILABLE_LABELS.join(', '),
              '',
              'Analyze the issue and return ONLY a JSON object with two fields:',
              '- "labels": array of 1-3 applicable labels',
              '- "summary": a short 1-2 line summary in Spanish of what the issue is about',
              '',
              'No explanation, no markdown fences, just the JSON object.',
              '',
              'Examples:',
              '* "La nave no rota" -> {"labels":["bug","gameplay"],"summary":"La rotacion de la nave no responde al input del teclado."}',
              '* "Add sound effects" -> {"labels":["enhancement"],"summary":"Se solicita agregar efectos de sonido al juego."}',
              '* "Game lags" -> {"labels":["performance"],"summary":"El juego tiene problemas de rendimiento con muchas particulas en pantalla."}'
            ].join('\n');

            let aiLabels = [];
            let aiSummary = '';

            try {
              const response = await fetch('https://dashscope-intl.aliyuncs.com/compatible-mode/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + process.env.DASHSCOPE_API_KEY
                },
                body: JSON.stringify({
                  model: 'qwen3.7-max',
                  messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: 'Title: ' + title + '\n\nBody: ' + body }
                  ],
                  temperature: 0.1,
                  max_tokens: 150
                })
              });

              const data = await response.json();
              const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;

              if (content) {
                const cleaned = content.trim().replace(/```json?\n?/g, '').replace(/```/g, '').trim();
                const parsed = JSON.parse(cleaned);
                aiLabels = (parsed.labels || []).filter(function(l) { return AVAILABLE_LABELS.includes(l); });
                aiSummary = parsed.summary || '';
              }
            } catch (err) {
              core.warning('AI triage failed: ' + err.message);
            }

            if (aiLabels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: aiLabels
              });
              core.info('Added labels: ' + aiLabels.join(', '));
            }

            if (aiSummary) {
              const appendBlock = '\n\n---\n\n> ' + aiSummary;
              const updatedBody = body + appendBlock;

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: updatedBody
              });

              core.info('Appended summary to issue body');
            }
